name: Release
# Push a tag such as v0.3.0 (matching __version__). It is published as a pre-release, which installed copies skip.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version in the code
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/stentor/__init__.py)
          test "v$code" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but __version__ is $code"; exit 1; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -e ".[dev]" && python -m pytest -q
      # A pre-release, so installed copies don't move yet. When it is time:
      #   gh release edit <tag> --prerelease=false --latest=false
      # Never --latest: GitHub's "latest" stays on hold-dictate 0.9.4, which copies installed before the rename read.
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" --prerelease --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
