[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stentor-pro"
dynamic = ["version"]
description = "The account, Stentor Cloud client, local Hebrew and English models and second language check of Stentor."
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["stentor>=0.10.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."stentor.extensions"]
pro = "stentor_pro.extension:Extension"

[tool.hatch.version]
path = "src/stentor_pro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stentor_pro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
